<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Tasks</h1>
<form method="post">
  <input type="text" name="title" placeholder="input new task">
    <button type="submit">add task</button>
</form>
<ul>
    {% for task in tasks %}
    <li>{{task.title}}</li>
    {% else %}
    <li>no task</li>
    {% endfor%}
</ul>

</body>
</html>
