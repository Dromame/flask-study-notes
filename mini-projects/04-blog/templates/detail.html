{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
 <article>
     <h1>{{ post.title }}</h1>
     <p>
         <em>{{ post.created_at.strftime("%Y-%m-%d %H:%M") }}
         </em>
     </p>
     <p>{{ post.summary }}</p>
<div>
    {{ post.body }}
</div>
 </article>
 <p>
<a href="{{ url_for('blog.edit', post_id=post.id) }}">编辑文章</a>
</p>
<form method="post" action="{{ url_for('blog.delete', post_id=post.id) }}">
<button type="submit">delete</button>
</form>
{% endblock %}
