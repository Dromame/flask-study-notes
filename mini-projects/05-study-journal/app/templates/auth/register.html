{% extends "base.html" %}

{% block title %}注册{% endblock %}

{% block content %}
  <section class="form-card">
    <h1>注册</h1>

    <form method="post">
      <label>用户名</label>
      <input type="text" name="username" required>

      <label>密码</label>
      <input type="password" name="password" required>

      <button type="submit">创建账号</button>
    </form>
  </section>
{% endblock %}
